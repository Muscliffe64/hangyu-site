<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>快门与运动模糊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: same dark studio page as the other lessons. Three pages:
   one photo records a stretch of time → in video the shutter is open for part of each frame → choosing a shutter for the shot.
   Color: light-yellow = the real world / your choice, lilac = the recorded photo / the reference. */
:root{
  color-scheme: dark;
  --bg:#0d0f12; --panel:#14171c; --panel2:#1a1e24; --line:#262b33;
  --fg:#ebe7df; --muted:#9198a2; --faint:#5d636c;
  --light:#e9c77f; --air:#86b6cf; --brass:#d8b06a; --digit:#b6a4e8; --err:#e86a7a; --good:#6cc08b;
  --display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --body:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px;display:flex;flex-direction:column;gap:26px}
header.top{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.6vw,64px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{max-width:62ch;color:var(--muted);font-size:16px;margin:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.lang button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.toolbtn{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.toolbtn[aria-pressed="true"]{color:#17120a;background:var(--brass);border-color:var(--brass)}
:is(.lang button,.toolbtn,.nav button,.pager button,.chip,.btn,.qopts button):focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;gap:4px;padding:5px;border-radius:14px;overflow-x:auto;scrollbar-width:none;
  background:rgba(20,23,28,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
.nav::-webkit-scrollbar{display:none}
.nav button{all:unset;cursor:pointer;flex:1 0 auto;display:flex;align-items:baseline;gap:8px;padding:9px 14px;border-radius:10px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px #343a43}
.nav button[aria-current="true"] span{color:var(--brass)}

section.page{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.shead{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:6px;align-items:baseline}
.snum{font-family:var(--mono);font-size:13px;color:var(--brass)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,34px);margin:0;line-height:1.15;text-wrap:balance}
.ssub{grid-column:2;color:var(--muted);max-width:68ch;margin:0}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.panel canvas{display:block;width:100%}
.plabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.plabel b{font-weight:600}
.plabel span{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.plabel.real b{color:var(--light)} .plabel.screen b{color:var(--digit)}

.ctrl{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.ctrl label{font-size:13px;color:var(--muted)}
.ctrl .grow{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
.ctrl output{font-family:var(--mono);font-size:15px;min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;accent-color:var(--brass);height:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip:hover{border-color:#3a414b;color:var(--fg)}
.chip[aria-pressed="true"]{color:#17120a;background:var(--brass);border-color:var(--brass)}
.btn{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);color:var(--fg);background:var(--panel2)}
.btn:hover{border-color:#3a414b}
.btn[disabled]{opacity:.4;cursor:default}

.readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.readout div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.readout span{font-size:11.5px;color:var(--muted)}
.readout b{font-family:var(--mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.verdict{margin:0;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.key{margin:0;padding:12px 16px;border-left:3px solid var(--brass);background:var(--panel);border-radius:0 12px 12px 0;max-width:78ch}
.key b{color:var(--brass)}
.big{font-family:var(--display);font-size:clamp(20px,2.8vw,30px);line-height:1.3;margin:0;text-wrap:balance}
.big em{font-style:normal;color:var(--light)} .big i{font-style:normal;color:var(--digit)} .big strong{color:var(--brass)}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line);margin-top:6px}
.pager button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.pager button:hover{border-color:#3a414b}
.pager button span{font-size:12px;color:var(--muted)}
.pager button b{font-family:var(--display);font-size:17px}
.pager .next{margin-left:auto;text-align:right}

.quiz{display:flex;flex-direction:column;gap:14px}
.q{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q p{margin:0}
.q .qq{font-weight:600}
.qopts{display:flex;gap:8px;flex-wrap:wrap}
.qopts button{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.qopts button.ok{border-color:var(--good);color:var(--good)}
.qopts button.no{border-color:var(--err);color:var(--err)}
.q .why{color:var(--muted);font-size:14px}

body.present{font-size:17px}
body.present .wrap{max-width:1560px}
body.present .lede,body.present .ssub,body.present .quiz{display:none}
body.present h1{font-size:clamp(26px,3vw,40px)}
@media (max-width:760px){
  .duo{grid-template-columns:1fr}
  .readout{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.verdict.good{border-color:var(--good);color:var(--good)}
.verdict.goal b{color:var(--brass)}
</style>
</head>

<script>
(function(){
"use strict";
/* ================= i18n & helpers ================= */
let lang="zh";
try{ const s=localStorage.getItem("mic-lang"); if(s==="en"||s==="zh") lang=s; }catch(e){}
const $=id=>document.getElementById(id);
const zh=()=>lang==="zh";
const FPS=24;
const T={
  eyebrow:["影像基础 · 05","Imaging Basics · 05"], home:["← 课程目录","← All lessons"], present:["投屏模式","Present"],
  title:["快门与运动模糊","Shutter Speed & Motion Blur"],
  lede:["上一课说，视频是一张接一张的照片。可是每一张照片也不是“一瞬间”：快门要打开一小段时间，让光进来。这段时间里在动的东西，都会被拖成一道影子。","Last lesson: video is one photo after another. But each photo is not an instant either. The shutter has to stay open for a short while to let light in, and anything that moves during that time gets smeared."],
  n1:["快门开多久","How long it opens"], n2:["快门与帧率","Shutter & frame rate"], n3:["用快门创作","Create with it"],
  prev:["上一页","Previous"], next:["下一页","Next"],
  s1h:["一张照片不是一瞬间","A photo is not an instant"],
  s1s:["左边是真实的世界：风车在转，人在跑。右边是相机在同一个时刻拍下的照片。把快门时间一点点调长，看看谁变糊了，谁一点没变。","Left: the real world, a windmill turning and a person running. Right: the photo the camera takes at the same moment each time. Make the shutter time longer step by step and see what blurs and what does not change at all."],
  p1real:["真实世界","The real world"], p1realS:["一直在动","always moving"], p1photo:["拍到的照片","The photo"],
  shLabel:["快门","Shutter"], realBright:["固定光圈和 ISO：看亮度变化","Fix aperture & ISO: show brightness"],
  click:["咔嚓","click"], sec:[" 秒"," s"],
  tlH:["快门打开的那一段","When the shutter is open"], tlS:["黄线：现在　紫块：快门打开","yellow line: now · purple: shutter open"],
  openFor:["快门打开 {d}","shutter open for {d}"],
  r1a:["快门速度","Shutter speed"], r1b:["打开的时间","Time open"], r1c:["跑步的人移动了","The runner moved"], r1d:["进光量（和 1/60 比）","Light (vs 1/60)"],
  same:["一样","the same"], more:["多 {n} 档，更亮","{n} stops more, brighter"], less:["少 {n} 档，更暗","{n} stops less, darker"],
  cm:[" 厘米"," cm"], m:[" 米"," m"],
  key1:["<b>要点</b>　快门打开多久，照片就记录多久。不动的东西怎么拍都清楚，动的东西会被拖出一段，这就是<b>运动模糊</b>。快门越快，画面越清楚，但进来的光也越少，画面会变暗，要靠开大光圈或提高 ISO 补回来（见“光圈、曝光与光线”一课）。","<b>Key idea</b>　The photo records everything that happens while the shutter is open. Things that stay still are always sharp; things that move are dragged into a streak. That is <b>motion blur</b>. A faster shutter gives a sharper picture but lets in less light, so the picture gets darker and you have to open the aperture or raise the ISO (see the lesson “Aperture, exposure & light”)."],
  s2h:["拍视频：每一格只开一部分时间","Video: each frame is open only part of the time"],
  s2s:["每秒拍 24 格，每一格就有 1/24 秒。快门可以在这段时间里一直开着，也可以只开一小会儿。电影人用“快门角度”来说开了多少：360° 是全开，180° 是开一半。左边换不同的角度，和右边的电影标准比一比。","At 24 frames a second, each frame gets 1/24 of a second. The shutter can stay open for all of that time or only a small part. Filmmakers describe this as the “shutter angle”: 360° is open the whole time, 180° is open for half. Change the angle on the left and compare it with the cinema standard on the right."],
  p2you:["你的选择","Your choice"], p2ref:["电影标准 180°","Cinema standard 180°"], p2refS:["1/48 秒","1/48 s"],
  angLabel:["快门角度","Shutter angle"], step:["下一格 ▸","Next frame ▸"], play:["⏸ 暂停看单格","⏸ Pause on one frame"], paused:["▶ 播放","▶ Play"],
  fl2H:["六格胶片的时间","The time of six frames"], fl2S:["亮：快门开着　暗：快门关着","bright: open · dark: closed"],
  slot:["1 格 = 1/24 秒","1 frame = 1/24 s"],
  r2a:["快门角度","Shutter angle"], r2b:["快门速度","Shutter speed"], r2c:["每格打开","Open per frame"], r2d:["每格关闭","Closed per frame"],
  v360:["每一格都拖得很长。运动很顺，但到处发糊，像喝醉了或者在做梦。","Every frame is smeared a long way. Motion is fluid but everything is soft, like being dizzy or in a dream."],
  v180:["这就是电影的样子：每格带一点模糊，刚好把上一格和下一格连起来。","This is the look of cinema: a little blur in each frame, just enough to join one frame to the next."],
  v90:["每格更清楚，动作开始有一点一跳一跳。动作片和战争片常用它制造紧张感。","Each frame is crisper and movement starts to look a little jumpy. Action and war films use this for tension."],
  v45:["每格几乎是清楚的定格，连起来一跳一跳，像一串快速的幻灯片。暂停看单格：非常清楚。","Each frame is almost a sharp freeze, and together they stutter like a rapid slide show. Pause on one frame: very sharp."],
  key2:["<b>要点：180° 规则</b>　拍视频时，快门时间大约是“帧率的两倍分之一”。每秒 24 格用 1/48（相机上选 1/50），30 格用 1/60，60 格用 1/120。这样每一格都带一点模糊，运动看起来最自然。快门太快，每格都很清楚，连起来反而一跳一跳；快门太慢，整个画面发糊。","<b>Key idea: the 180° rule</b>　For video, set the shutter time to about one over twice the frame rate. At 24 fps use 1/48 (1/50 on most cameras), at 30 fps use 1/60, at 60 fps use 1/120. Each frame then carries a little blur and motion looks most natural. Too fast and every frame is sharp but the motion stutters; too slow and the whole picture goes soft."],
  s3h:["没有“正确”的快门，只有合适的快门","There is no “correct” shutter, only the right one for the shot"],
  s3s:["选一个场景，读一读拍摄目标，然后调快门，直到右边的照片变成你想要的样子。","Pick a scene, read the goal, then change the shutter until the photo on the right looks the way you want."],
  sceneLabel:["场景","Scene"], p3real:["眼前的场景","The scene in front of you"], p3photo:["拍到的照片","The photo"], bright3:["亮度已自动补偿","brightness auto-corrected"],
  goal:["拍摄目标：","Goal: "], tripod:["相机在三脚架上","camera on a tripod"], follow:["相机跟着人转","camera follows the runner"],
  scSplash:["水球爆开","Water balloon"], scCars:["夜晚车流","Night traffic"], scWater:["瀑布","Waterfall"], scPan:["追拍","Panning"],
  gSplash:["把每一颗水珠都定在空中。","Freeze every single droplet in the air."],
  gCars:["把车灯拍成长长的、连续的光线。","Turn the car lights into long, unbroken lines of light."],
  gWater:["把瀑布拍得像一片柔滑的白纱。","Make the waterfall look like a smooth white veil."],
  gPan:["人要清楚，背景要拉成线，让人感到速度。","Keep the runner sharp and stretch the background into streaks, so we feel the speed."],
  okSplash:["✓ 水珠颗颗分明。这么短的时间里，它们几乎来不及移动。","✓ Every droplet is clear. In such a short time they hardly move at all."],

function carLights(g,w,h,tt,glow){
  for(const c of CARS){ const x=carX(c,w,tt), y=c.y*h, len=w*.075*c.s, d=Math.sign(c.v), r=2.6*c.s;
    const dot=(px,py,col)=>{ if(glow){ g.globalAlpha=.3; g.fillStyle=col; g.beginPath(); g.arc(px,py,r*2.4,0,7); g.fill(); g.globalAlpha=1; } g.fillStyle=col; g.beginPath(); g.arc(px,py,r,0,7); g.fill(); };
    dot(x+d*len/2,y+2*c.s,"#fff2c8"); dot(x-d*len/2,y-3*c.s,"#ff4a3a"); }
}
function carBodies(g,w,h,tt){ g.fillStyle="#2b303a"; for(const c of CARS){ const x=carX(c,w,tt), y=c.y*h, len=w*.075*c.s, ch=h*.045*c.s; g.beginPath(); g.roundRect(x-len/2,y-ch*.7,len,ch,ch*.3); g.fill(); g.beginPath(); g.roundRect(x-len*.28,y-ch*1.3,len*.5,ch*.7,ch*.25); g.fill(); } }
function cars(g,w,h,tt){ street(g,w,h); carBodies(g,w,h,tt); carLights(g,w,h,tt,true); }
function carsPhoto(c,t0,dT){                       // lights saturate the sensor, so trails keep their brightness: accumulate with "lighten"
  const g=c.g, n=clamp(Math.ceil(dT*.55*c.w/2),1,520); street(g,c.w,c.h); if(dT<=1/15) carBodies(g,c.w,c.h,t0+dT/2);
  g.globalCompositeOperation="lighten"; for(let i=0;i<n;i++) carLights(g,c.w,c.h,t0+dT*(i+.5)/n,n<4); g.globalCompositeOperation="source-over";
}
/* waterfall */
const FALL=(()=>{ const r=rng(31), a=[]; for(let i=0;i<300;i++) a.push({x:r(),ph:r(),v:.8+.6*r(),l:r()}); return a; })();
const FOAM=(()=>{ const r=rng(33), a=[]; for(let i=0;i<46;i++) a.push({x:r(),y:r(),f:3+6*r(),p:r()*7}); return a; })();
function fall(g,w,h,tt){
  g.globalAlpha=1; const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,"#1a2a2e"); gr.addColorStop(1,"#0f191c"); g.fillStyle=gr; g.fillRect(0,0,w,h);
  const x0=w*.36, x1=w*.64, top=h*.1, bot=h*.8;
  g.fillStyle="rgba(190,215,230,.2)"; g.fillRect(x0,top,x1-x0,bot-top);
  g.fillStyle="rgba(236,245,250,.8)";
  for(let i=0;i<FALL.length;i++){ const d=FALL[i], fr=(((d.ph+tt*d.v)%1)+1)%1; g.fillRect(x0+(x1-x0-5)*d.x+Math.sin(fr*6+i)*3,top+Math.pow(fr,1.7)*(bot-top),2.5+2.5*d.l,7+18*fr); }
  g.fillStyle="#1d3540"; g.fillRect(0,bot,w,h-bot);
  for(const f of FOAM){ g.globalAlpha=.35+.35*Math.sin(tt*f.f*3+f.p); g.fillStyle="#e6f1f6"; g.beginPath(); g.arc(x0-w*.04+(x1-x0+w*.08)*f.x+Math.sin(tt*f.f+f.p)*w*.02,bot+h*.012+f.y*h*.07+Math.cos(tt*f.f*1.3+f.p)*4,3+3*f.y,0,7); g.fill(); }
  g.globalAlpha=1; g.fillStyle="#262c33"; g.strokeStyle="#3a424c"; g.lineWidth=1.5;
  const rock=p=>{ g.beginPath(); p.forEach((q,i)=>i?g.lineTo(q[0]*w,q[1]*h):g.moveTo(q[0]*w,q[1]*h)); g.closePath(); g.fill(); g.stroke(); };
  rock([[0,.02],[.3,.04],[.37,.1],[.35,.34],[.38,.6],[.33,.83],[0,.86]]); rock([[1,.03],[.7,.05],[.63,.1],[.66,.4],[.62,.62],[.68,.84],[1,.86]]);
  rock([[.14,.9],[.2,.84],[.28,.87],[.3,.94],[.16,.96]]); rock([[.74,.93],[.79,.86],[.88,.88],[.9,.95]]);
}
/* panning: the camera turns with the runner, so the runner stays put and the background streams past */
function pan(g,w,h,tt){
  g.globalAlpha=1; g.fillStyle=C.panel; g.fillRect(0,0,w,h); const gy=h*.82, sp=w*1.1, wrap=(x,span)=>((x%span)+span)%span;
  g.strokeStyle=C.line; g.lineWidth=1; for(let i=0;i<7;i++){ const x=wrap(i*w/5-tt*sp*.12,w*1.4)-w*.2; g.beginPath(); g.moveTo(x,gy); g.lineTo(x+w*.07,gy-h*.3-((i*37)%5)*h*.03); g.lineTo(x+w*.14,gy); g.stroke(); }
  for(let i=0;i<5;i++){ const x=wrap(i*w*.31-tt*sp*.55,w*1.55)-w*.2; g.fillStyle="#3b4a44"; g.fillRect(x-3,gy-h*.2,6,h*.2); g.fillStyle="#31453c"; g.beginPath(); g.arc(x,gy-h*.3,h*.11,0,7); g.fill(); }
  g.strokeStyle=C.faint; g.lineWidth=1.5; g.beginPath(); g.moveTo(0,gy); g.lineTo(w,gy); g.stroke();
  for(let i=0;i<9;i++){ const x=wrap(i*w/6-tt*sp,w*1.5)-w*.25; g.fillStyle=i%3?"#7c838d":C.brass; g.fillRect(x,gy-h*.17,5,h*.17); g.fillStyle=C.faint; g.fillRect(x-w*.03,gy+h*.06,w*.06,3); }
  runner(g,w*.5,gy,h*.6,tt*1.6,C.light);
}
const SH3=[1/2000,1/500,1/125,1/50,1/30,1/15,1/4,1,4];
const SCENES={
  splash:{draw:splash,t0:.5,v:2.4,cap:60,goal:"gSplash",note:"tripod",judge:d=>d<=1/500?["ok","okSplash"]:["no","loSplash"]},
  cars:{draw:cars,t0:0,photo:carsPhoto,goal:"gCars",note:"tripod",judge:d=>d>=1?["ok","okCars"]:["no","hiCars"]},
  water:{draw:fall,t0:0,v:1.9,cap:60,goal:"gWater",note:"tripod",judge:d=>d>=1/4?["ok","okWater"]:["no","hiWater"]},
  pan:{draw:pan,t0:.3,v:2.2,cap:60,goal:"gPan",note:"follow",judge:d=>d<1/60?["no","hiPan"]:d<=1/15?["ok","okPan"]:["no","loPan"]}
};
const SCN=["splash","cars","water","pan"], SCT={splash:"scSplash",cars:"scCars",water:"scWater",pan:"scPan"};
const S3={scene:"splash",i:3,t:0,dirty:true};
try{ const q=new URLSearchParams(location.search), sc=q.get("scene"), sh=+q.get("sh"); if(SCENES[sc]) S3.scene=sc; if(q.has("sh")&&SH3[sh]) S3.i=sh; }catch(e){}   // optional deep link: ?scene=cars&sh=7#create
function draw3(dt){
  S3.t+=dt; const a=CV.c3a, b=CV.c3b; if(!a||!b) return; const sc=SCENES[S3.scene], dT=SH3[S3.i];
  sc.draw(a.g,a.w,a.h,S3.t);
  if(S3.dirty){ S3.dirty=false;
    if(sc.photo) sc.photo(b,sc.t0,dT); else expose(b,sc.draw,sc.t0,dT,samples(dT,sc.v*b.h,sc.cap));
    hud(b.g,16,14,shTxt(dT),C.fg); }
}
function ui3(){
  const sc=SCENES[S3.scene], dT=SH3[S3.i], j=sc.judge(dT);
  document.querySelectorAll("#sc3chips button").forEach(b=>{ b.setAttribute("aria-pressed",b.dataset.v===S3.scene); b.textContent=t(SCT[b.dataset.v]); });
  document.querySelectorAll("#sh3chips button").forEach(b=>{ b.setAttribute("aria-pressed",+b.dataset.v===S3.i); b.textContent=shTxt(SH3[+b.dataset.v]); });
  $("sh3").value=S3.i; $("sh3o").textContent=shTxt(dT);
  $("goal3").innerHTML="<b>"+t("goal")+"</b>"+t(sc.goal);
  $("p3realS").textContent=t(sc.note); $("p3photoS").textContent=t("bright3");
  const v=$("verdict3"); v.textContent=t(j[1]); v.classList.toggle("good",j[0]==="ok");
  S3.dirty=true;
}
function init3(){
  $("sc3chips").innerHTML=SCN.map(v=>`<button type="button" class="chip" data-v="${v}"></button>`).join("");
  $("sc3chips").onclick=e=>{ const b=e.target.closest("button"); if(b){ S3.scene=b.dataset.v; S3.i=3; ui3(); } };
  $("sh3chips").innerHTML=[0,1,3,5,6,7,8].map(v=>`<button type="button" class="chip" data-v="${v}"></button>`).join("");
  $("sh3chips").onclick=e=>{ const b=e.target.closest("button"); if(b){ S3.i=+b.dataset.v; ui3(); } };
  $("sh3").oninput=e=>{ S3.i=+e.target.value; ui3(); };
}
const QA=QUIZ.map(()=>-1);
function renderQuiz(){
  $("quiz").innerHTML=QUIZ.map((q,i)=>{ const p=QA[i];
    return `<div class="q"><p class="qq">${i+1}. ${L2(q.q)}</p><div class="qopts">${q.o.map((o,j)=>`<button type="button" data-q="${i}" data-o="${j}" class="${p===j?(j===q.a?"ok":"no"):""}">${L2(o)}</button>`).join("")}</div>${p<0?"":`<p class="why">${t(p===q.a?"right":"wrong")}${p===q.a?L2(q.why):""}</p>`}</div>`; }).join("");
}
$("quiz").onclick=e=>{ const b=e.target.closest("button"); if(b){ QA[+b.dataset.q]=+b.dataset.o; renderQuiz(); } };

/* ================= shell: pages, language, loop ================= */
const PIDS=["open","angle","create"], PNAME={open:"n1",angle:"n2",create:"n3"};
let cur="open";
function renderNav(){
  $("nav").innerHTML=PIDS.map((p,i)=>`<button type="button" data-go="${p}" aria-current="${p===cur}"><span>0${i+1}</span>${t(PNAME[p])}</button>`).join("");
  document.querySelectorAll("[data-pager]").forEach(el=>{ const i=PIDS.indexOf(el.dataset.pager), a=PIDS[i-1], b=PIDS[i+1];
    el.innerHTML=(a?`<button type="button" data-go="${a}"><span>← ${t("prev")}</span><b>${t(PNAME[a])}</b></button>`:"")+(b?`<button type="button" class="next" data-go="${b}"><span>${t("next")} →</span><b>${t(PNAME[b])}</b></button>`:""); });
}
function resizeAll(){
  for(const id in HEIGHTS){ const cv=$(id), w=cv.getBoundingClientRect().width; if(w) fit(id,HEIGHTS[id](w)); }
  S1.dirty=true; S2.lastK=-1; S3.dirty=true;
}
function showPage(id,scroll){
  if(!PIDS.includes(id)) id=PIDS[0]; cur=id; PIDS.forEach(p=>$(p).hidden=p!==id);
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id));
  try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch(e){}
  resizeAll();
  if(scroll){ const y=$("nav").getBoundingClientRect().top+window.scrollY-12; if(window.scrollY>y) window.scrollTo({top:y}); }
}
function applyLang(){
  document.documentElement.lang=zh()?"zh-CN":"en"; document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
  $("lang-zh").setAttribute("aria-pressed",zh()); $("lang-en").setAttribute("aria-pressed",!zh());
  renderNav(); renderQuiz(); ui1(); ui2(); ui3();
}
/* the other lessons remember the language under two different keys; write both so the choice follows the student */
const setLang=l=>{ lang=l; try{ localStorage.setItem("mic-lang",l); localStorage.setItem("lab-lang",JSON.stringify(l)); }catch(e){} applyLang(); };
$("lang-zh").onclick=()=>setLang("zh"); $("lang-en").onclick=()=>setLang("en");
document.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) showPage(b.dataset.go,true); });
window.addEventListener("hashchange",()=>showPage(location.hash.slice(1),false));
$("present").onclick=()=>{ const on=!document.body.classList.contains("present"); document.body.classList.toggle("present",on); $("present").setAttribute("aria-pressed",on); requestAnimationFrame(resizeAll); };
document.addEventListener("keydown",e=>{ if(e.altKey||e.ctrlKey||e.metaKey) return; const tg=e.target; if(tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA")) return;
  const i=PIDS.indexOf(cur); if(e.key==="ArrowRight"&&i<PIDS.length-1){ e.preventDefault(); showPage(PIDS[i+1],true); } else if(e.key==="ArrowLeft"&&i>0){ e.preventDefault(); showPage(PIDS[i-1],true); } });
window.addEventListener("resize",resizeAll);
init1(); init2(); init3();
applyLang();
showPage(location.hash.slice(1),false);
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.1,(now-last)/1000); last=now; if(document.hidden) return;
  if(cur==="open") draw1(dt); else if(cur==="angle") draw2(dt); else draw3(dt); }
requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(resizeAll);
})();
</script>
