<title>景别与焦距</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: same dark studio page as the other lessons. Three pages:
   shot sizes → two ways to get closer (walk in, or a longer lens) → why a wide lens up close bends a face.
   Every picture is a real pinhole projection of a small 3D scene, drawn far-to-near on a 2D canvas. */
:root{
  color-scheme: dark;
  --bg:#0d0f12; --panel:#14171c; --panel2:#1a1e24; --line:#262b33;
  --fg:#ebe7df; --muted:#9198a2; --faint:#5d636c;
  --light:#e9c77f; --air:#86b6cf; --brass:#d8b06a; --digit:#b6a4e8; --err:#e86a7a; --good:#6cc08b;
  --display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --body:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px;display:flex;flex-direction:column;gap:26px}
header.top{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.6vw,64px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{max-width:62ch;color:var(--muted);font-size:16px;margin:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.lang button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.toolbtn{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.toolbtn[aria-pressed="true"]{color:#17120a;background:var(--brass);border-color:var(--brass)}
:is(.lang button,.toolbtn,.nav button,.pager button,.chip,.btn,.qopts button):focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;gap:4px;padding:5px;border-radius:14px;overflow-x:auto;scrollbar-width:none;
  background:rgba(20,23,28,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
.nav::-webkit-scrollbar{display:none}
.nav button{all:unset;cursor:pointer;flex:1 0 auto;display:flex;align-items:baseline;gap:8px;padding:9px 14px;border-radius:10px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px #343a43}
.nav button[aria-current="true"] span{color:var(--brass)}

section.page{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.shead{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:6px;align-items:baseline}
.snum{font-family:var(--mono);font-size:13px;color:var(--brass)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,34px);margin:0;line-height:1.15;text-wrap:balance}
.ssub{grid-column:2;color:var(--muted);max-width:68ch;margin:0}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.panel canvas{display:block;width:100%}
.plabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.plabel b{font-weight:600}
.plabel span{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.plabel.real b{color:var(--light)} .plabel.screen b{color:var(--digit)}

.ctrl{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.ctrl label{font-size:13px;color:var(--muted)}
.ctrl .grow{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
.ctrl output{font-family:var(--mono);font-size:15px;min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;accent-color:var(--brass);height:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip:hover{border-color:#3a414b;color:var(--fg)}
.chip[aria-pressed="true"]{color:#17120a;background:var(--brass);border-color:var(--brass)}
.btn{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);color:var(--fg);background:var(--panel2)}
.btn:hover{border-color:#3a414b}
.btn[disabled]{opacity:.4;cursor:default}

.readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.readout div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.readout span{font-size:11.5px;color:var(--muted)}
.readout b{font-family:var(--mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.verdict{margin:0;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.key{margin:0;padding:12px 16px;border-left:3px solid var(--brass);background:var(--panel);border-radius:0 12px 12px 0;max-width:78ch}
.key b{color:var(--brass)}
.big{font-family:var(--display);font-size:clamp(20px,2.8vw,30px);line-height:1.3;margin:0;text-wrap:balance}
.big em{font-style:normal;color:var(--light)} .big i{font-style:normal;color:var(--digit)} .big strong{color:var(--brass)}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line);margin-top:6px}
.pager button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.pager button:hover{border-color:#3a414b}
.pager button span{font-size:12px;color:var(--muted)}
.pager button b{font-family:var(--display);font-size:17px}
.pager .next{margin-left:auto;text-align:right}

.quiz{display:flex;flex-direction:column;gap:14px}
.q{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q p{margin:0}
.q .qq{font-weight:600}
.qopts{display:flex;gap:8px;flex-wrap:wrap}
.qopts button{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.qopts button.ok{border-color:var(--good);color:var(--good)}
.qopts button.no{border-color:var(--err);color:var(--err)}
.q .why{color:var(--muted);font-size:14px}

body.present{font-size:17px}
body.present .wrap{max-width:1560px}
body.present .lede,body.present .ssub,body.present .quiz{display:none}
body.present h1{font-size:clamp(26px,3vw,40px)}
@media (max-width:760px){
  .duo{grid-template-columns:1fr}
  .readout{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.duo.wide{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.info{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.info h3{margin:0;font-family:var(--display);font-size:22px;line-height:1.2}
.info h3 small{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);margin-left:10px;letter-spacing:.04em}
.info p{margin:0;max-width:74ch}
.info .cut{color:var(--muted);font-size:14px}
.info .says b{color:var(--brass)}
.mapcv{touch-action:pan-y;cursor:ew-resize}
@media (max-width:760px){ .duo.wide{grid-template-columns:1fr} }
</style>
</head>

<script>
(function(){
"use strict";
/* ================= i18n & helpers ================= */
let lang="zh";
try{ const s=localStorage.getItem("mic-lang"); if(s==="en"||s==="zh") lang=s; }catch(e){}
const $=id=>document.getElementById(id);
const zh=()=>lang==="zh";
const T={
  eyebrow:["影像基础 · 06","Imaging Basics · 06"], home:["← 课程目录","← All lessons"], present:["投屏模式","Present"],
  title:["景别与焦距","Shot Size & Focal Length"],
  lede:["每拍一个镜头，先要决定两件事：画面里装下多少东西，以及用什么办法装。站得远还是近，用广角还是长焦，拍出来的不只是大小不同，连背景和人的脸都会变。","Every shot starts with two decisions: how much to fit in the frame, and how to fit it. Standing far or near, using a wide or a long lens: these change more than size. They change the background, and even the face."],
  n1:["景别","Shot sizes"], n2:["走近，还是换镜头","Walk in, or zoom in"], n3:["近拍会变形","Up close, faces bend"],
  prev:["上一页","Previous"], next:["下一页","Next"],
  vf:["取景器","Viewfinder"],
  s1h:["六种景别：画面里装多少","Six shot sizes: how much is in the frame"],
  s1s:["同一个人，同一个地方，摄影机越靠近，画面里的人就越大。电影人给这些大小起了名字，叫“景别”。逐个点一遍，看每种景别在告诉观众什么。","Same person, same place: the closer the camera, the bigger she is in the frame. Film-makers have names for these sizes. Click through them and see what each one tells the audience."],
  sizeLabel:["景别","Shot size"], cutH:["画面切在哪里","Where the frame cuts"], cutS:["亮框 = 当前景别","bright box = current size"],
  elsNote:["远景：画面比这张图大得多","Extreme wide: far bigger than this picture"],
  d1:["50mm 镜头，距离 {d}","50mm lens, {d} away"],
  cutL:["取景：","Framing: "], saysL:["它在说：","It says: "],
  key1:["<b>要点</b>　景别越大（远景、全景），观众看到的是<b>环境和动作</b>；景别越小（特写、大特写），观众看到的是<b>表情和情绪</b>。拍一场戏，通常先用大景别交代“在哪里”，再用小景别带观众走近人物。","<b>Key idea</b>　Wider shots show <b>the place and the action</b>; tighter shots show <b>the face and the feeling</b>. A scene usually opens wide to say “where are we”, then moves in tight to bring the audience close to the character."],
  s2h:["把人拍大的两种办法","Two ways to make her bigger"],
  s2s:["想让人物在画面里更大，可以走近，也可以站着不动换一支更长的镜头。人物可以拍得一样大，但背景完全不同。左边是俯视图，右边是摄影机看到的画面。","To make the subject bigger you can walk closer, or stay put and use a longer lens. She can end up the same size, yet the background is completely different. Left: the view from above. Right: what the camera sees."],
  mapH:["俯视图","From above"], mapS:["拖动相机改变距离","drag the camera to move it"],
  fLabel:["焦距","Focal length"], dLabel:["相机到人物","Camera to subject"],
  lock:["保持人物一样大","Keep her the same size"], reset:["重置","Reset"],
  r2a:["焦距","Focal length"], r2b:["水平视角","Angle of view"], r2c:["距离","Distance"], r2d:["20 米外的背景看起来","Background 20 m behind looks"],
  r2dv:["人物处的 {p}%","{p}% of its size at the subject"],
  camL:["相机","Camera"], subjL:["人物","Subject"], farL:["远山 →","mountains →"],
  wide:["广角","wide"], normal:["标准","normal"], tele:["长焦","telephoto"],
  v2try:["试一试：点亮“保持人物一样大”，再把焦距从 16mm 慢慢拖到 200mm。人物不变，看背景。","Try it: switch on “Keep her the same size”, then drag the focal length slowly from 16mm to 200mm. She stays put; watch the background."],
  v2wide:["广角 + 靠近：背景又小又远，装进了一大片环境。空间显得很深。","Wide lens, close camera: the background is small and far away, and a lot of it fits in. The space feels deep."],
  v2mid:["接近人眼的感觉：人物和背景的大小关系很自然。","Close to how your eyes see it: subject and background sit in a natural balance."],
  v2tele:["长焦 + 退远：背景被放大，像是贴在人物身后；只剩下窄窄一条。这叫“空间压缩”。","Long lens, far camera: the background is magnified and seems pressed up behind her, and only a narrow slice remains. This is called “compression”."],
  key2:["<b>要点</b>　焦距只决定<b>画面截取多宽</b>：焦距越长，视角越窄，像是把画面中间裁下来放大。<b>透视</b>（远近物体的大小关系）只由<b>相机站在哪里</b>决定。所以“走近”和“换长焦”不是一回事：走近改变背景与人物的比例，换长焦只是放大。","<b>Key idea</b>　Focal length only decides <b>how wide a slice you take</b>: a longer lens has a narrower angle, like cropping the middle of the picture and enlarging it. <b>Perspective</b> (how big near and far things look relative to each other) is decided only by <b>where the camera stands</b>. So walking in and zooming in are not the same: walking in changes the balance of subject and background; zooming only magnifies."],
  s3h:["广角贴近拍，脸会变形","A wide lens up close bends the face"],
  s3s:["下面的头在画面里始终一样大：相机越近，就自动换成越广的镜头。把距离从 1 米拖到 20 厘米，看鼻子和耳朵。","The head below always fills the frame equally: the closer the camera, the wider the lens it switches to. Drag the distance from a metre down to 20 cm and watch the nose and the ears."],
  topH:["俯视图","From above"], topS:["相机到鼻尖、到耳朵","camera to nose tip, to ears"],
  d3Label:["相机到脸","Camera to face"],
  r3a:["配合的焦距","Matching lens"], r3b:["到鼻尖","To the nose tip"], r3c:["到耳朵","To the ears"], r3d:["鼻子比耳朵放大","Nose enlarged vs ears"],
  noseL:["鼻尖 {d}","nose {d}"], earL:["耳朵 {d}","ear {d}"],
  v3a:["鼻子很大，耳朵快看不见了，脸变得又尖又长。手机贴着脸自拍就是这个样子。","Big nose, ears almost gone, and the face looks long and pointed. This is what a phone selfie at arm's length or closer does."],
  v3b:["还有一点变形：鼻子略大，脸略窄。","Still a little distorted: the nose is slightly large and the face slightly narrow."],
  v3c:["比例自然。拍人像爱用 85mm 左右，就是因为可以站在 1 米以外。","Natural proportions. Portraits are often shot around 85mm precisely because you can stand more than a metre away."],
  key3:["<b>要点</b>　变形不是镜头“坏”，而是<b>离得太近</b>。离脸 25 厘米时，鼻尖到相机的距离只有耳朵的六成，所以鼻子被放大得多；退到 1 米以外，这点差别就不算什么了。想拍好看的特写：<b>退后一点，用长一点的焦距</b>。","<b>Key idea</b>　The distortion is not a “bad” lens; it is <b>being too close</b>. At 25 cm from a face the nose tip is only about 60% as far from the camera as the ears, so it is magnified much more. Beyond a metre that difference hardly matters. For a flattering close-up: <b>step back and use a longer lens</b>."],
  quizH:["小测","Quick quiz"], right:["对了。","Correct. "], wrong:["再想想。","Not quite. "],
  u_m:[" 米"," m"], u_cm:[" 厘米"," cm"]
};

  const w=cw("v2"); if(!w) return; const c=fit("v2",Math.round(w*9/16));
  drawScene(c.g,c.w,c.h,{y:AIM,z:-S2.d,f:S2.f});
  hud(c.g,22,22,num(S2.f,0)+"mm · "+dist(S2.d),C.fg);
  drawMap();
}
function ui2(){
  const f=S2.f, d=S2.d, ang=2*Math.atan(18/f)*180/Math.PI;
  $("f2").value=Math.round(f2s(f)*1000); $("dist2").value=Math.round(d2s(d)*1000);
  $("f2o").textContent=num(f,0)+"mm"; $("dist2o").textContent=dist(d);
  document.querySelectorAll("#f2chips button").forEach(b=>b.setAttribute("aria-pressed",Math.abs(+b.dataset.v-f)<.6));
  $("lock2").setAttribute("aria-pressed",S2.lock);
  $("v2S").textContent=t(f<35?"wide":f<=70?"normal":"tele");
  $("ro2").innerHTML=[["r2a",num(f,0)+"mm"],["r2b",num(ang,0)+"°"],["r2c",dist(d)],["r2d",t("r2dv",{p:num(d/(d+20)*100,0)})]].map(r=>`<div><span>${t(r[0])}</span><b>${r[1]}</b></div>`).join("");
  $("verdict2").textContent=!S2.lock?t("v2try"):t(f<30?"v2wide":f<=70?"v2mid":"v2tele");
  draw2();
}
function setF(f){ f=clamp(f,FMIN,FMAX); if(S2.lock){ const d=clamp(f*S2.k,DMIN,DMAX); S2.d=d; f=clamp(d/S2.k,FMIN,FMAX); } S2.f=f; ui2(); }
function setD(d){ d=clamp(d,DMIN,DMAX); if(S2.lock){ const f=clamp(d/S2.k,FMIN,FMAX); S2.f=f; d=clamp(f*S2.k,DMIN,DMAX); } S2.d=d; ui2(); }
function init2(){
  $("f2chips").innerHTML=[16,24,35,50,85,135,200].map(v=>`<button type="button" class="chip" data-v="${v}">${v}</button>`).join("");
  $("f2chips").onclick=e=>{ const b=e.target.closest("button"); if(b) setF(+b.dataset.v); };
  $("f2").oninput=e=>{ let f=s2f(+e.target.value/1000); for(const s of [24,35,50,85,135]) if(Math.abs(f2s(s)-f2s(f))<.012) f=s; setF(f); };
  $("dist2").oninput=e=>setD(s2d(+e.target.value/1000));
  $("lock2").onclick=()=>{ S2.lock=!S2.lock; S2.k=S2.d/S2.f; ui2(); };
  $("reset2").onclick=()=>{ S2.f=35; S2.d=3.5; S2.lock=false; ui2(); };
  const cv=$("m2"), at=e=>{ const b=cv.getBoundingClientRect(), z=MAP.z0+(e.clientX-b.left)/b.width*(MAP.z1-MAP.z0); setD(-z); };
  cv.addEventListener("pointerdown",e=>{ S2.drag=true; cv.setPointerCapture(e.pointerId); at(e); });
  cv.addEventListener("pointermove",e=>{ if(S2.drag) at(e); });
  ["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,()=>{ S2.drag=false; }));
}

/* ================= page 3: a 3D head, close and far ================= */
/* head: an ellipsoid centred on the origin, facing -z (towards the camera). Sizes in metres. */
const HA=.075, HB=.115, HC=.095, EYE_Z=-.085, NOSE_Z=-.125, EAR_Z=.012, EAR_X=.086, HEAD_FILL=.25;   // the head outline always spans HEAD_FILL x frame width from centre to chin
const D3MIN=.14, D3MAX=2.5, s2D=v=>D3MIN*Math.pow(D3MAX/D3MIN,v), D2s=d=>Math.log(d/D3MIN)/Math.log(D3MAX/D3MIN);
/* the silhouette of the head seen from distance L has tan(half-angle) = HB / sqrt(L² - HC²); pick the lens that keeps it constant */
const fFor=D=>{ const L=D-EYE_Z; return 36*HEAD_FILL*Math.sqrt(L*L-HC*HC)/HB; };
const dFor=f=>Math.sqrt(Math.pow(f*HB/(36*HEAD_FILL),2)+HC*HC)+EYE_Z;
const zs=(x,y)=>-HC*Math.sqrt(Math.max(0,1-x*x/(HA*HA)-y*y/(HB*HB)));
const LIGHT=(()=>{ const v=[-.45,.5,-.74], l=Math.hypot(v[0],v[1],v[2]); return v.map(k=>k/l); })();
function ellipsoid(cx,cy,cz,a,b,c,nLat,nLon,colFn){
  const q=[], pt=(i,j)=>{ const th=Math.PI*i/nLat, ph=2*Math.PI*j/nLon; return [cx+a*Math.sin(th)*Math.sin(ph),cy+b*Math.cos(th),cz-c*Math.sin(th)*Math.cos(ph)]; };
  for(let i=0;i<nLat;i++) for(let j=0;j<nLon;j++){ const v=[pt(i,j),pt(i,j+1),pt(i+1,j+1),pt(i+1,j)], m=[0,1,2].map(k=>(v[0][k]+v[1][k]+v[2][k]+v[3][k])/4);
    let n=[(m[0]-cx)/(a*a),(m[1]-cy)/(b*b),(m[2]-cz)/(c*c)]; const l=Math.hypot(n[0],n[1],n[2]); n=n.map(k=>k/l); q.push({v,m,n,col:colFn(m)}); }
  return q;
}
const SK=[226,180,140], HR=[43,35,32], SH=[214,178,104];
const MESH=[].concat(
  ellipsoid(0,-.4,.03,.2,.21,.115,10,20,()=>SH),
  ellipsoid(0,-.15,.012,.05,.085,.05,6,14,()=>mix(SK,[0,0,0],.12)),
  ellipsoid(0,0,0,HA,HB,HC,26,40,m=>(m[1]>.03-m[2]*.5||(m[2]>.04&&m[1]>-.075))?HR:SK));
const EARS=[-1,1].map(s=>{ const v=[]; for(let i=0;i<14;i++){ const a=i/14*2*Math.PI; v.push([s*(EAR_X+.004)+Math.cos(a)*.014,-.004+Math.sin(a)*.027,EAR_Z]); } return {v,m:[s*EAR_X,0,EAR_Z],n:null,col:mix(SK,[150,90,70],.25)}; });
function drawHead(g,W,H,D){
  const camZ=EYE_Z-D, camY=-.012, F=fFor(D)/36*W, P=p=>{ const d=p[2]-camZ; return [W/2+p[0]*F/d,H/2-(p[1]-camY)*F/d]; };
  const gr=g.createRadialGradient(W/2,H*.45,10,W/2,H*.5,W*.75); gr.addColorStop(0,"#2a3038"); gr.addColorStop(1,"#14171c"); g.fillStyle=gr; g.fillRect(0,0,W,H);
  const list=MESH.filter(q=>q.n[0]*(q.m[0])+q.n[1]*(q.m[1]-camY)+q.n[2]*(q.m[2]-camZ)<0).concat(EARS).sort((p,q)=>q.m[2]-p.m[2]);
  for(const q of list){ const sh=q.n?.6+.4*Math.max(0,q.n[0]*LIGHT[0]+q.n[1]*LIGHT[1]+q.n[2]*LIGHT[2]):.8, col=rgb(mix([0,0,0],q.col,sh));
    g.fillStyle=col; g.strokeStyle=col; g.lineWidth=1; g.beginPath(); q.v.forEach((p,i)=>{ const s=P(p); i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1]); }); g.closePath(); g.fill(); g.stroke(); }
  const S=p=>F/(p[2]-camZ), on=(x,y,lift)=>[x,y,zs(x,y)-(lift||.001)];
  const poly=(pts,fill,stroke,lw)=>{ g.beginPath(); pts.forEach((p,i)=>{ const s=P(p); i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1]); }); if(fill){ g.closePath(); g.fillStyle=fill; g.fill(); } if(stroke){ g.strokeStyle=stroke; g.lineWidth=lw; g.lineCap="round"; g.lineJoin="round"; g.stroke(); } };
  const ring=(cx,cy,rx,ry)=>{ const a=[]; for(let i=0;i<18;i++){ const an=i/18*2*Math.PI; a.push(on(cx+Math.cos(an)*rx,cy+Math.sin(an)*ry)); } return a; };
  for(const s of [-1,1]){ const ex=s*.031, ey=.014, sc=S(on(ex,ey));
    poly(ring(ex,ey,.0145,.0085),"#f4efe6"); poly(ring(ex,ey,.0072,.0072),"#6b4a2f"); poly(ring(ex,ey,.0034,.0034),"#120e0c");
    const lid=[], brow=[]; for(let i=0;i<=8;i++){ const u=i/8*2-1; lid.push(on(ex+u*.0155,ey+.0085*(1-u*u)+.001)); brow.push(on(ex+u*.018,ey+.021+.006*(1-u*u)-s*u*.002)); }
    poly(lid,null,"#2b2320",Math.max(1,.0028*sc)); poly(brow,null,"#2b2320",Math.max(1.2,.0055*sc)); }
  const mouth=[]; for(let i=0;i<=10;i++){ const u=i/10*2-1; mouth.push(on(u*.023,-.066-.005*(1-u*u))); }
  poly(mouth,null,"#b5524a",Math.max(1.5,.0065*S(mouth[5])));
  const tip=[0,-.026,NOSE_Z], top=on(0,.02), nl=on(-.021,-.037), nr=on(.021,-.037);                // the nose: a small pyramid
  poly([top,tip,nl],rgb(mix([0,0,0],SK,.93))); poly([top,tip,nr],rgb(mix([0,0,0],SK,.8))); poly([nl,tip,nr],rgb(mix([0,0,0],SK,.68)));
  g.strokeStyle="rgba(235,231,223,.55)"; g.lineWidth=1.5; const m=12, l=18;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(k=>{ g.beginPath(); g.moveTo(k[0]+l*k[2],k[1]); g.lineTo(k[0],k[1]); g.lineTo(k[0],k[1]+l*k[3]); g.stroke(); });
}
function drawTop(g,W,H,D){
  g.fillStyle=C.panel; g.fillRect(0,0,W,H);
  const camZ=EYE_Z-D, sc=Math.min((W-110)/(HC-camZ+.03),H*.62/(2*EAR_X+.04)), cy=H*.5, x0=44, X=z=>x0+(z-camZ)*sc, Y=x=>cy+x*sc;
  g.fillStyle=rgb(HR); g.beginPath(); g.ellipse(X(0),Y(0),HC*sc,HA*sc,0,0,7); g.fill();                                  // head from above: hair
  g.fillStyle=rgb(SK); for(const s of [-1,1]){ g.beginPath(); g.ellipse(X(EAR_Z),Y(s*EAR_X),.014*sc,.012*sc,0,0,7); g.fill(); }
  g.beginPath(); g.ellipse(X(0),Y(0),HC*sc,HA*sc,0,Math.PI*.62,Math.PI*1.38); g.fill();
  g.beginPath(); g.moveTo(X(-.086),Y(-.016)); g.lineTo(X(NOSE_Z),Y(0)); g.lineTo(X(-.086),Y(.016)); g.fill();
  const ray=(z,x,col)=>{ g.strokeStyle=col; g.lineWidth=1.6; g.beginPath(); g.moveTo(X(camZ),Y(0)); g.lineTo(X(z),Y(x)); g.stroke(); g.fillStyle=col; g.beginPath(); g.arc(X(z),Y(x),3.5,0,7); g.fill(); };
  ray(EAR_Z,-EAR_X,C.light); ray(EAR_Z,EAR_X,C.light); ray(NOSE_Z,0,C.digit);
  const x=X(camZ); g.fillStyle=C.fg; g.beginPath(); g.roundRect(x-22,cy-11,22,22,3); g.fill(); g.beginPath(); g.moveTo(x,cy-6); g.lineTo(x+7,cy-9); g.lineTo(x+7,cy+9); g.lineTo(x,cy+6); g.fill();
  g.font="12px "+FB; g.textAlign="center"; g.textBaseline="top"; g.fillStyle=C.fg; g.fillText(t("camL"),x-8,cy+18);
  g.font="13px "+FB; g.textAlign="left"; g.textBaseline="alphabetic";
  g.fillStyle=C.digit; g.fillText(t("noseL",{d:cm(D-(EYE_Z-NOSE_Z))}),14,24);
  g.fillStyle=C.light; g.fillText(t("earL",{d:cm(D+EAR_Z-EYE_Z)}),14,44);
}
const S3={D:1};
function draw3(){
  const w=cw("v3"); if(!w) return; const h=clamp(Math.round(w*.78),240,480), a=fit("v3",h); drawHead(a.g,a.w,a.h,S3.D);
  hud(a.g,22,22,num(fFor(S3.D),0)+"mm · "+dist(S3.D),C.fg);
  const w2=cw("t3"), b=fit("t3",Math.abs(w2-w)<40&&$("t3").getBoundingClientRect().top===$("v3").getBoundingClientRect().top?h:260); drawTop(b.g,b.w,b.h,S3.D);
}
function ui3(){
  const D=S3.D, dn=D-(EYE_Z-NOSE_Z), de=D+EAR_Z-EYE_Z, f=fFor(D);
  $("d3").value=Math.round(D2s(D)*1000); $("d3o").textContent=dist(D);
  document.querySelectorAll("#d3chips button").forEach(b=>b.setAttribute("aria-pressed",Math.abs(+b.dataset.v-f)<.8));
  $("v3S").textContent=t(f<35?"wide":f<=70?"normal":"tele");
  $("ro3").innerHTML=[["r3a",num(f,0)+"mm"],["r3b",cm(dn)],["r3c",cm(de)],["r3d","+"+num((de/dn-1)*100,0)+"%"]].map(r=>`<div><span>${t(r[0])}</span><b>${r[1]}</b></div>`).join("");
  $("verdict3").textContent=t(D<.42?"v3a":D<.9?"v3b":"v3c");
  draw3();
}
function init3(){
  $("d3chips").innerHTML=[16,24,35,50,85,135,200].map(v=>`<button type="button" class="chip" data-v="${v}">${v}mm</button>`).join("");
  $("d3chips").onclick=e=>{ const b=e.target.closest("button"); if(b){ S3.D=clamp(dFor(+b.dataset.v),D3MIN,D3MAX); ui3(); } };
  $("d3").oninput=e=>{ S3.D=s2D(+e.target.value/1000); ui3(); };
}
const QA=QUIZ.map(()=>-1);
function renderQuiz(){
  $("quiz").innerHTML=QUIZ.map((q,i)=>{ const p=QA[i];
    return `<div class="q"><p class="qq">${i+1}. ${L2(q.q)}</p><div class="qopts">${q.o.map((o,j)=>`<button type="button" data-q="${i}" data-o="${j}" class="${p===j?(j===q.a?"ok":"no"):""}">${L2(o)}</button>`).join("")}</div>${p<0?"":`<p class="why">${t(p===q.a?"right":"wrong")}${p===q.a?L2(q.why):""}</p>`}</div>`; }).join("");
}
$("quiz").onclick=e=>{ const b=e.target.closest("button"); if(b){ QA[+b.dataset.q]=+b.dataset.o; renderQuiz(); } };

/* ================= shell: pages, language ================= */
const PIDS=["sizes","lens","face"], PNAME={sizes:"n1",lens:"n2",face:"n3"};
let cur="sizes";
function renderNav(){
  $("nav").innerHTML=PIDS.map((p,i)=>`<button type="button" data-go="${p}" aria-current="${p===cur}"><span>0${i+1}</span>${t(PNAME[p])}</button>`).join("");
  document.querySelectorAll("[data-pager]").forEach(el=>{ const i=PIDS.indexOf(el.dataset.pager), a=PIDS[i-1], b=PIDS[i+1];
    el.innerHTML=(a?`<button type="button" data-go="${a}"><span>← ${t("prev")}</span><b>${t(PNAME[a])}</b></button>`:"")+(b?`<button type="button" class="next" data-go="${b}"><span>${t("next")} →</span><b>${t(PNAME[b])}</b></button>`:""); });
}
function redraw(){ if(cur==="sizes"){ drawCuts(); draw1(); } else if(cur==="lens") draw2(); else draw3(); }
function showPage(id,scroll){
  if(!PIDS.includes(id)) id=PIDS[0]; cur=id; PIDS.forEach(p=>$(p).hidden=p!==id);
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id));
  try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch(e){}
  redraw();
  if(scroll){ const y=$("nav").getBoundingClientRect().top+window.scrollY-12; if(window.scrollY>y) window.scrollTo({top:y}); }
}
function applyLang(){
  document.documentElement.lang=zh()?"zh-CN":"en"; document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
  $("lang-zh").setAttribute("aria-pressed",zh()); $("lang-en").setAttribute("aria-pressed",!zh());
  renderNav(); renderQuiz(); ui1(); ui2(); ui3();
}
/* the other lessons remember the language under two different keys; write both so the choice follows the student */
const setLang=l=>{ lang=l; try{ localStorage.setItem("mic-lang",l); localStorage.setItem("lab-lang",JSON.stringify(l)); }catch(e){} applyLang(); };
$("lang-zh").onclick=()=>setLang("zh"); $("lang-en").onclick=()=>setLang("en");
document.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) showPage(b.dataset.go,true); });
window.addEventListener("hashchange",()=>showPage(location.hash.slice(1),false));
$("present").onclick=()=>{ const on=!document.body.classList.contains("present"); document.body.classList.toggle("present",on); $("present").setAttribute("aria-pressed",on); requestAnimationFrame(redraw); };
document.addEventListener("keydown",e=>{ if(e.altKey||e.ctrlKey||e.metaKey) return; const tg=e.target; if(tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA")) return;
  const i=PIDS.indexOf(cur); if(e.key==="ArrowRight"&&i<PIDS.length-1){ e.preventDefault(); showPage(PIDS[i+1],true); } else if(e.key==="ArrowLeft"&&i>0){ e.preventDefault(); showPage(PIDS[i-1],true); } });
let rz=0; window.addEventListener("resize",()=>{ cancelAnimationFrame(rz); rz=requestAnimationFrame(redraw); });
init1(); init2(); init3();
applyLang();
showPage(location.hash.slice(1),false);
document.fonts&&document.fonts.ready.then(redraw);
})();
</script>
